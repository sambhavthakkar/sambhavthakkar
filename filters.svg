<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 372" preserveAspectRatio="xMidYMid meet">
  <rect width="900" height="372" fill="#1c1d20"/>
  <style>
    .title { font: 500 22px 'Segoe UI', Ubuntu, sans-serif; }
    .sub { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #999a9e; }
    .body { font: 400 13.5px 'Segoe UI', Ubuntu, sans-serif; fill: #c8c9cc; }
  </style>

  <!-- Rust -->
  <rect x="12" y="12" width="432" height="168" rx="16" fill="none" stroke="#2e2f32"/>
  <rect x="12" y="12" width="6" height="168" rx="3" fill="#f74c00"/>
  <text class="title" x="36" y="48" fill="#f74c00">Rust</text>
  <text class="sub" x="36" y="70">systems &amp; tooling</text>
  <text class="body" x="36" y="100">Software that stays fast, safe, and close to the metal.</text>
  <text class="body" x="36" y="120">Ownership at compile time, tooling teams can</text>
  <text class="body" x="36" y="140">trust in production.</text>

  <!-- Design -->
  <rect x="456" y="12" width="432" height="168" rx="16" fill="none" stroke="#2e2f32"/>
  <rect x="456" y="12" width="6" height="168" rx="3" fill="#c4b5fd"/>
  <text class="title" x="480" y="48" fill="#c4b5fd">Design</text>
  <text class="sub" x="480" y="70">consultation</text>
  <text class="body" x="480" y="100">Product thinking, interfaces, and systems that</text>
  <text class="body" x="480" y="120">survive contact with engineering. Not a Figma file</text>
  <text class="body" x="480" y="140">as the deliverable — the decision is.</text>

  <!-- Go -->
  <rect x="12" y="192" width="432" height="168" rx="16" fill="none" stroke="#2e2f32"/>
  <rect x="12" y="192" width="6" height="168" rx="3" fill="#00add8"/>
  <text class="title" x="36" y="228" fill="#00add8">Go</text>
  <text class="sub" x="36" y="250">backend &amp; services</text>
  <text class="body" x="36" y="280">Simple services. Explicit errors. Easy to run.</text>
  <text class="body" x="36" y="300">Readable handlers and APIs other humans</text>
  <text class="body" x="36" y="320">enjoy reviewing.</text>

  <!-- Mobile -->
  <rect x="456" y="192" width="432" height="168" rx="16" fill="none" stroke="#2e2f32"/>
  <rect x="456" y="192" width="6" height="168" rx="3" fill="#13b9fd"/>
  <text class="title" x="480" y="228" fill="#13b9fd">Mobile</text>
  <text class="sub" x="480" y="250">cross-platform</text>
  <text class="body" x="480" y="280">One codebase, every screen. Flutter in production;</text>
  <text class="body" x="480" y="300">Kotlin Multiplatform and Compose Multiplatform</text>
  <text class="body" x="480" y="320">as the same mobile practice grows.</text>
</svg>
