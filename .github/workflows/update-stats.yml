name: Update stats

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and freeze cards
        run: python3 scripts/update_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg streak.svg contrib.svg stats-strip.svg
          if git diff --staged --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "chore: refresh GitHub stats"
          git push
