name: Update stats

on:
  schedule:
    # Safety net only — the poller in update_stats.py early-exits no-op runs.
    # Offset minute avoids :00 congestion and GitHub's 10-60m schedule delays.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/**
  repository_dispatch:
    types: [activity-ping]

concurrency:
  group: update-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Fetch and freeze cards
        run: python3 scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg streak.svg contrib.svg stats-strip.svg README.md .stats-cache.json
          if git diff --staged --quiet; then
            echo "No stats changes"
            exit 0
          fi
          # [skip ci]: pushes by GITHUB_TOKEN don't trigger workflows anyway;
          # this keeps forks/manual remotes quiet too.
          git commit -m "$(cat <<'EOF'
          chore: refresh stats [skip ci]

          Generated with Codebuff 🤖
          Co-Authored-By: Codebuff <noreply@codebuff.com>
          EOF
          )"
          git push
